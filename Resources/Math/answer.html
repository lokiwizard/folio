<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<style>
:root { color-scheme: light dark }
* { box-sizing: border-box }
body { margin: 0; background: transparent; overflow: hidden; color: CanvasText; font: 15px/1.55 -apple-system, sans-serif }
#answer { display: flow-root; white-space: pre-wrap; overflow-wrap: anywhere }
#answer :is(h1,h2,h3,h4,h5,h6) { margin: .65em 0 .2em; font-weight: 650; line-height: 1.3 }
#answer > :first-child { margin-top: 0 }
#answer > :last-child { margin-bottom: 0 }
h1 { font-size: 1.4em }
h2 { font-size: 1.27em }
h3 { font-size: 1.16em }
h4,h5,h6 { font-size: 1em }
.formula { white-space: normal; font-size: 1.08em }
.display { display: block; overflow-x: auto; padding: .4em 0; text-align: center }
.display math { margin-inline: auto; min-width: max-content }
code { font: .92em ui-monospace, monospace }
</style>
<div id="answer"></div>
<script src="katex.min.js"></script>
<script src="answer.js"></script>
