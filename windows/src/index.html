<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data: blob:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'none'"><title>Folio</title>
<link rel="stylesheet" href="../assets/pdf/web/pdf_viewer.css"><link rel="stylesheet" href="style.css"></head>
<body><header><button id="home" class="brand" aria-label="Folio">Folio</button><button id="open" data-label="打开 PDF|Open PDF"></button><span id="docTitle"></span><div class="space"></div><button id="navToggle" data-doc data-label="导航|Navigate"></button><button id="findToggle" data-doc data-label="查找|Find"></button><button id="clip" data-doc data-label="框选图表|Clip figure"></button><button id="ask" data-doc data-label="问 AI|Ask AI"></button><button id="more" data-doc data-label="文件|File"></button><button id="settings" data-label="设置|Settings"></button><button id="lang" aria-label="Language">中 / EN</button></header>
<main id="library"><section><h1>Folio</h1><p data-label="论文阅读与批注|Research PDF reader"></p><button id="libraryOpen" class="primary" data-label="打开论文…|Open a paper…"></button><h2 data-label="最近打开|Recent papers"></h2><div id="recents"></div></section></main>
<main id="desk" hidden><aside id="navigation"><div id="navTabs" class="tabs"></div><div id="navList" class="scroll"></div></aside><div id="leftDivider" class="divider"></div>
<section id="reading"><div id="findBar" hidden><input id="query" type="search" data-placeholder="查找正文|Find in paper"><span id="matches"></span><button id="prevMatch">↑</button><button id="nextMatch">↓</button><button id="closeFind">×</button></div>
<div id="canvasArea"><div id="viewerContainer" tabindex="0"><div id="viewer" class="pdfViewer"></div></div></div>
<footer><button id="back" data-label="返回|Back"></button><button id="previous">‹</button><input id="page" type="number" min="1" aria-label="Page"><span id="pageCount"></span><button id="next">›</button><div class="space"></div><button id="zoomOut">−</button><select id="zoom"></select><button id="zoomIn">+</button><button id="rotate" data-label="旋转|Rotate"></button><button id="mode" data-label="单页|Single page"></button></footer></section>
<div id="rightDivider" class="divider"></div><aside id="inspector"><div id="rightTabs" class="tabs"></div><div id="rightContent"></div></aside></main>
<div id="actionBar" class="popover" hidden></div><div id="toast" role="status" hidden></div><div id="printPages"></div>
<script src="../assets/math/katex.min.js"></script><script type="module" src="app.mjs"></script></body></html>
