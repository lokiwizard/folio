name: Folio Windows
on:
  workflow_dispatch:
  push:
    branches: [windows/folio-v1.1]
    paths: ['windows/**', '.github/workflows/folio-windows.yml', 'Resources/Math/**', 'Tests/Fixtures/**']
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - name: Install the Windows package
        shell: pwsh
        run: |
          $macInfo = [xml](Get-Content ../Resources/Info.plist -Raw)
          $version = $macInfo.SelectSingleNode("/plist/dict/key[.='CFBundleShortVersionString']/following-sibling::string[1]").InnerText
          $setup = Get-Item "../dist/windows/FolioSetup-$version-x64.exe" -ErrorAction Stop
          $installDir = Join-Path $env:RUNNER_TEMP 'FolioInstalled'
          $process = Start-Process -FilePath $setup.FullName -ArgumentList '/S',('/D=' + $installDir) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $exe = Join-Path $installDir 'Folio.exe'
          if (!(Test-Path $exe)) { throw 'Installed executable missing' }
          if ((Get-Item $exe).VersionInfo.ProductVersion -notin @($version, "$version.0")) { throw 'Installed product version differs from macOS' }
          Get-FileHash $setup.FullName -Algorithm SHA256 | Format-List
          "FOLIO_TEST_EXE=$exe" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
      - name: Test the installed application
        env:
          FOLIO_SCREENSHOT_DIR: ${{ github.workspace }}/dist/windows
        run: npm run test:ui
      - name: Repeat desktop regression at 150 percent display scaling
        env:
          FOLIO_TEST_SCALE: '1.5'
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        with:
          name: Folio-Windows-x64
          retention-days: 1
          path: |
            dist/windows/FolioSetup-*-x64.exe
            dist/windows/Folio-Windows-*.png
